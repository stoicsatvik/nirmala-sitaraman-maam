name: E361 procurement evidence gates
on:
  push:
    branches:
      - foundry/e361-cppp-false-record-quarantine-20261028
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "src/types.ts"
      - "supabase/migrations/**"
      - ".github/workflows/e361-procurement-evidence.yml"
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx --test tests/procurement-evidence.test.ts
      - run: npx tsx experiments/e361_snapshot_audit.ts | tee e361-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: e361-historical-snapshot-audit
          path: e361-audit.json
      - run: npm run validate:seed
      - run: npm run build
